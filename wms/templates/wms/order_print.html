{% load tz %}
<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Štampa narudžbi</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:#172c40;font:14px Arial,sans-serif;line-height:1.5}.sheet{max-width:800px;margin:24px auto;background:white;padding:40px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:2px solid #172c40;padding-bottom:20px}header img{max-width:150px;max-height:70px;object-fit:contain}h1{font-size:24px;margin:0}h2{font-size:15px;margin:0 0 8px}p{margin:4px 0}.customer{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:24px 0}address{font-style:normal}table{width:100%;border-collapse:collapse;margin:24px 0}th,td{padding:10px 8px;border-bottom:1px solid #ddd;text-align:right;vertical-align:top}th:first-child,td:first-child{text-align:left;overflow-wrap:anywhere}th{background:#f5f7fa;font-size:12px}small{display:block;color:#53616b}.summary{max-width:340px;margin-left:auto}.summary p{display:flex;justify-content:space-between;gap:16px;padding:6px 0}.total{font-size:18px;border-top:2px solid #172c40;margin-top:8px!important;padding-top:12px!important}footer{margin-top:36px;text-align:center;color:#53616b}.actions{display:flex;justify-content:center;padding:16px;gap:12px}.actions button{padding:12px 20px;font:inherit;cursor:pointer;border:1px solid #ccc;border-radius:6px;background:white}.note{white-space:normal;overflow-wrap:anywhere}thead{display:table-header-group}tr,.summary,.customer{break-inside:avoid}
@page{size:A4 portrait;margin:12mm}
@media print{
  body{font-size:10pt;line-height:1.3}
  header{padding-bottom:10px;gap:12px}
  header img{max-width:110px;max-height:45px}
  h1{font-size:17pt}
  h2{font-size:10pt;margin-bottom:4px}
  p{margin:2px 0}
  .customer{gap:16px;margin:12px 0}
  table{margin:12px 0;font-size:9pt}
  th,td{padding:5px 6px;line-height:1.25}
  th{font-size:8pt}
  th:not(:first-child),td:not(:first-child){white-space:nowrap}
  small{font-size:8pt;line-height:1.25}
  .summary{max-width:280px}
  .summary p{padding:3px 0}
  .total{font-size:12pt;margin-top:5px!important;padding-top:6px!important}
  .note{margin-top:12px;font-size:9pt}
  footer{margin-top:18px;font-size:9pt}
}
@media print{body{background:white;color:black}.sheet{max-width:none;margin:0;padding:0}.actions{display:none}th{background:none}header{break-inside:avoid}}
@media screen and (max-width:600px){.sheet{margin:0;padding:16px}.customer{grid-template-columns:1fr}h1{font-size:20px}th,td{padding:8px 4px;font-size:12px}.summary{max-width:none}}
[hidden]{display:none!important}
@media print{.sheet + .sheet{break-before:page}}
</style>
</head>
<body>
<div class="actions"><button type="button" onclick="window.print()">Štampaj narudžbu</button><button type="button" onclick="window.close()">Zatvori</button></div>
{% for document in documents %}{% include 'wms/order_print_document.html' with order=document.order items=document.items subtotal=document.subtotal %}{% endfor %}

<div class="actions" id="printConfirmation" hidden>
<form method="post" action="{% url 'wms:orders_mark_printed' %}">{% csrf_token %}
{% for document in documents %}<input type="hidden" name="orders" value="{{ document.order.pk }}">{% endfor %}
<p>Je li štampanje uspjelo?</p><button type="submit">Označi kao odštampano</button>
</form></div>
<script>
window.addEventListener('afterprint', () => { document.querySelector('#printConfirmation').hidden = false; });
window.addEventListener('load', () => window.print());
</script>
</body></html>
